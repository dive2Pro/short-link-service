spring.application.name=short-link-service
spring.profiles.active=postgres
spring.datasource.url=jdbc:postgresql://localhost:5433/short_link

spring.datasource.username=short_link
spring.datasource.password=short_link_dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only expose the operational endpoints needed during local development.
management.endpoints.web.exposure.include=health,info,metrics
# Enables /actuator/health/liveness and /actuator/health/readiness probes.
management.endpoint.health.probes.enabled=true

# redis

sprint.data.redis.timeout=200ms
sprint.data.redis.connect-timeout=200ms

# shortlink cache
shortlink.cache.ttl-seconds=300