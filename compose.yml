services:
    postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: short_link
        POSTGRES_USER: short_link
        POSTGRES_PASSWORD: short_link_dev
      ports:
      - "5433:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
    redis:
      image: redis:7
      ports:
      - "6379:6379"
      volumes:
        - redis-data:/data

volumes:
    postgres-data:
    redis-data:
